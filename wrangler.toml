# Déploiement du worker : npx wrangler deploy
# À remplir avant le premier déploiement (valeurs visibles dans le dashboard Cloudflare) :
#   - kv_namespaces.id        → Workers & Pages → KV → namespace utilisé par WIKI_CACHE
#   - d1_databases.database_id → résultat de `npx wrangler d1 create veilleurs`
name = "veilleurs"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-01"

# Pas d'URL de prévisualisation publique pour chaque version
preview_urls = false

# Garde les variables texte et secrets déjà définis dans le dashboard (BOT_TOKEN, ADMIN_SECRET, FIREBASE_SA…)
keep_vars = true

[[kv_namespaces]]
binding = "WIKI_CACHE"
id = "bcf46723e68946d2b594f8f790a3c9ef"

[[d1_databases]]
binding = "DB"
database_name = "veilleurs"
database_id = "8deed6e8-1a17-4339-86ef-fad656a886a9"

# Aucune tâche planifiée : le bot Discord (GitHub Actions) est lancé par des événements (item écrit, validation, ouverture de la page…), jamais à intervalle de temps.
