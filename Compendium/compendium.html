  <script type="module">
    import { store } from '../store.js';
    import { db, COL, loadCollection, hasRole, logPageView, logItemView, logSearchQuery, logContentView } from '../firebase.js';
    logPageView('compendium');
    window._vclLogItemView    = logItemView;
    window._vclLogSearchQuery = logSearchQuery;
    window._vclLogContentView = logContentView;
    import { collection, getDocs, getDoc, doc }
      from '../d1db.js';

    try {
      await store.load(['items', 'mobs', 'pnj', 'panoplies']);
      store.populateGlobals();
    } catch (err) {
      console.error('[Compendium] Erreur Firestore :', err);
    }
    // Complétion des fiches (accueil du glossaire) : champs requis définis en modération → Qualité (config/data_quality_standards)
    try {
      const [stdSnap, ignSnap] = await Promise.all([
        getDoc(doc(db, 'config', 'data_quality_standards')).catch(() => null),
        getDoc(doc(db, 'config', 'completion_ignored')).catch(() => null),
      ]);
      const std = stdSnap && stdSnap.exists() ? stdSnap.data() : {};
      window._vcl_dq = { items: std.items || null, ignored: new Set((ignSnap && ignSnap.exists() && ignSnap.data().items) || []) };
    } catch (err) {
      console.warn('[Compendium] complétion indisponible :', err);
    }
    window._pageInit?.();

  </script>
