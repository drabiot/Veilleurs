name: Discord bot

# Envoi des items sur Discord (serveur principal + serveurs inscrits via Discord/discord.html), sans PC allumé.
# Secrets GitHub à créer (Settings → Secrets and variables → Actions) : BOT_TOKEN, ADMIN_SECRET.
on:
  schedule:
    - cron: '*/30 * * * *'   # secours : le worker Cloudflare lance déjà le bot toutes les 10 min (GitHub retarde ou saute parfois ses crons)
  workflow_dispatch:

# Jamais deux passages en même temps (même état, mêmes salons)
concurrency:
  group: discord-bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # pour se relancer tant qu'un gros envoi n'est pas fini

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Passage du bot
        id: run
        run: node bot/discord-watch.js --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          RUN_MINUTES: 14
      # Un gros envoi avance mais n'est pas fini : on enchaîne tout de suite avec un nouveau passage (sans attendre les 10 min du cron)
      - name: Relance si envoi en cours
        if: steps.run.outputs.more == 'true'
        run: gh workflow run discord-bot.yml --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
