name: Stamp versions

# Après chaque push : met à jour les ?v=… des scripts/styles (hash du contenu) pour que les navigateurs rechargent les fichiers modifiés.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'img/**']

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/stamp-versions.js
      - name: Commit si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' '*.js'
          git diff --cached --quiet || { git commit -m "Versions ?v= (hash du contenu) [skip ci]" && git pull --rebase -q && git push; }
